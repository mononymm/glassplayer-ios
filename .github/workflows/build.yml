name: Build IPA

on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # GitHub reports a capacity shortage on Apple-silicon Mac runners; Intel Macs build the same IPA.
    runs-on: ${{ vars.MAC_RUNNER || 'macos-15-intel' }}
    timeout-minutes: 60
    env:
      VERSION: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Toolchain
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_2[6-9]*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          sw_vers
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          curl -fsSL -o /tmp/xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen
          echo "/tmp/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate project
        run: xcodegen generate

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-${{ hashFiles('project.yml') }}

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project GlassPlayer.xcodeproj \
            -scheme GlassPlayer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION=${{ env.VERSION }} CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build 2>&1 | tee build.log | grep -E "error:|warning: unable|BUILD (SUCCEEDED|FAILED)|\*\*" || true
          test -d build/Build/Products/Release-iphoneos/GlassPlayer.app

      - name: Show errors
        if: failure()
        run: grep -E "error:" -A3 build.log | head -200 || true

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/GlassPlayer.app Payload/
          zip -qry GlassPlayer.ipa Payload
          ls -lh GlassPlayer.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: GlassPlayer-ipa
          path: GlassPlayer.ipa

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: GlassPlayer.ipa

      - name: Release notes
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          {
            echo "## Changes"
            if [ -n "$prev" ]; then
              git log --no-merges --pretty='- %s' "$prev"..HEAD
            else
              git log --no-merges --pretty='- %s' -n 15
            fi
            echo
            echo "## Verify your download"
            echo "SHA-256:"
            echo '```'
            shasum -a 256 GlassPlayer.ipa
            echo '```'
            echo "Built by GitHub Actions from commit ${GITHUB_SHA} ([build log](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})). Check the signed build certificate with:"
            echo '```'
            echo "gh attestation verify GlassPlayer.ipa --repo ${GITHUB_REPOSITORY}"
            echo '```'
            echo
            echo "Install **GlassPlayer.ipa** with Sideloadly. Personal project, not made for public use; see the README."
          } > notes.md
          cat notes.md

      - name: Remove the old rolling "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest --cleanup-tag -y || true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Glass for iPhone ${{ env.VERSION }}
          body_path: notes.md
          make_latest: true
          files: GlassPlayer.ipa
