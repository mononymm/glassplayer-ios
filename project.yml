name: GlassPlayer
options:
  bundleIdPrefix: com.mononymm
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  MPVKit:
    url: https://github.com/mpvkit/MPVKit
    exactVersion: 1.1.0-n9.0.2

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    ENABLE_BITCODE: "NO"

targets:
  GlassPlayer:
    type: application
    platform: iOS
    sources:
      - path: GlassPlayer
    dependencies:
      - package: MPVKit
        product: MPVKit-GPL
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mononymm.glassplayer
        PRODUCT_NAME: GlassPlayer
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: GlassPlayer/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
